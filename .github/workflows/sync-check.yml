name: Drift Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Verify Harness Adapters Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Anti-Drift Check
        run: python3 scripts/sync.py --check

      - name: Run Python Offline Unit Tests
        run: python3 -m unittest discover -v -s tests

      - name: Run Pi Extension Tests
        run: npm test --prefix pi-extension

      - name: Verify Clean npm Package
        run: npm pack --dry-run
