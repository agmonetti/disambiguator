name: Drift Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-drift:
    name: Verify Harness Adapters Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Anti-Drift Check
        run: python3 scripts/sync.py --check

      - name: Run Offline Unit Tests
        run: python3 -m unittest discover tests
